name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "llms-full.txt"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "llms-full.txt"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GORELEASER_VERSION: v2.18.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The protocol build tags are required: without them the tagged-protocol
      # validation tests self-skip.
      - run: go test -race -tags "$(make -s print-tags)" ./...

  # Release targets are cross-compiled once per push to main; PRs skip this to
  # stay fast. The matrix mirrors .goreleaser.yaml builds[0].goos/goarch.
  cross_build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile the release matrix
        run: |
          set -eu
          TAGS="$(make -s print-tags)"
          GOOS=linux GOARCH=amd64 go build -trimpath -tags "$TAGS" ./cmd/cheburbox
          GOOS=linux GOARCH=arm64 go build -trimpath -tags "$TAGS" ./cmd/cheburbox
          GOOS=darwin GOARCH=amd64 go build -trimpath -tags "$TAGS" ./cmd/cheburbox
          GOOS=darwin GOARCH=arm64 go build -trimpath -tags "$TAGS" ./cmd/cheburbox
          rm -f cheburbox

  release_config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go run ./hack/noticegen
      - name: NOTICE and licenses/ must be up to date
        run: |
          git add --intent-to-add -- NOTICE licenses
          git diff HEAD --exit-code -- NOTICE licenses
