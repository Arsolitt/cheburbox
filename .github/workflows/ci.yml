name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "llms-full.txt"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "llms-full.txt"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GORELEASER_VERSION: v2.18.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Replaced by the explicit Cache Go state step below: the built-in
          # cache shares one key per run and races between jobs.
          cache: false
      - name: Cache Go state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The run id forces a fresh save every run, so unchanged dependencies
          # stay warm for the next run; restores fall back through this job's
          # earlier entries, then any entry for the platform.
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Replaced by the explicit Cache Go state step below: the built-in
          # cache shares one key per run and races between jobs.
          cache: false
      - name: Cache Go state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The run id forces a fresh save every run, so unchanged dependencies
          # stay warm for the next run; restores fall back through this job's
          # earlier entries, then any entry for the platform.
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      # The protocol build tags are required: without them the tagged-protocol
      # validation tests self-skip.
      - run: go test -race -tags "$(make -s print-tags)" ./...

  # Release targets are cross-compiled once per push to main; PRs skip this to
  # stay fast. Each architecture compiles on its own runner: recompiling the
  # whole dependency graph for arm64 on the amd64 runner would dominate the
  # run, so the arm targets use the free arm64 runner. The matrix mirrors
  # .goreleaser.yaml builds[0].goos/goarch.
  cross_build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: linux/amd64 darwin/amd64
          - runner: ubuntu-24.04-arm
            targets: linux/arm64 darwin/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Replaced by the explicit Cache Go state step below: the built-in
          # cache shares one key per run and races between jobs.
          cache: false
      - name: Cache Go state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The run id forces a fresh save every run, so unchanged dependencies
          # stay warm for the next run; restores fall back through this job's
          # earlier entries, then any entry for the platform.
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Cross-compile the release matrix
        run: |
          set -eu
          TAGS="$(make -s print-tags)"
          for target in ${{ matrix.targets }}; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -tags "$TAGS" ./cmd/cheburbox
            rm -f cheburbox
          done

  release_config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The check runs no Go command, so it has nothing worth caching. It is
          # also the first job to finish: with caching enabled it would win the
          # shared cache save race with an empty state and starve every other
          # job of the module cache until go.mod changes.
          cache: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Replaced by the explicit Cache Go state step below: the built-in
          # cache shares one key per run and races between jobs.
          cache: false
      - name: Cache Go state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The run id forces a fresh save every run, so unchanged dependencies
          # stay warm for the next run; restores fall back through this job's
          # earlier entries, then any entry for the platform.
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - run: go mod download
      - run: go run ./hack/noticegen
      - name: NOTICE and licenses/ must be up to date
        run: |
          git add --intent-to-add -- NOTICE licenses
          git diff HEAD --exit-code -- NOTICE licenses
